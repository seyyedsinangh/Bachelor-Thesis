[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-frame-embedded-od"
version = "1.0.9"
description = "ST-VGG/ResCat event-SNN, strict RGB twin and ANN-native DSEC object detection comparison"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3", "torchvision>=0.18",
  "numpy>=1.26,<2.0; python_version < '3.13'",
  "numpy>=2.0,<2.6; python_version >= '3.13'", "pandas>=2.0",
  "Pillow>=10", "h5py>=3.10", "hdf5plugin>=4.4", "matplotlib>=3.8",
  "pycocotools>=2.0.7", "torchmetrics>=1.4", "nvidia-ml-py>=12.0",
  "tabulate>=0.9"
]

[project.optional-dependencies]
sanafe = ["sanafe>=2.2.9,<3"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
